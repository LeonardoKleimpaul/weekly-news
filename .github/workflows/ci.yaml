---
name: CI

on:
  push:
    branches:
      - main
  pull_request: ~
  workflow_dispatch: ~

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build Docker images
        uses: docker/bake-action@v7
        with:
          pull: true
          load: true
          source: .
          files: |
            compose.yaml
            compose.override.yaml
          set: |
            *.cache-from=type=gha,scope=${{github.ref}}
            *.cache-from=type=gha,scope=refs/heads/main
            *.cache-to=type=gha,scope=${{github.ref}},mode=max
      - name: Start services
        run: |
          cp .env.example .env
          docker compose up --wait --no-build
      - name: Validate PHP and Symfony configuration
        run: |
          docker compose exec -T php sh -c 'find src config migrations tests public -type f -name "*.php" -print0 | xargs -0 -n 1 php -l'
          docker compose exec -T php bin/console lint:container
          docker compose exec -T php bin/console lint:twig templates/
          docker compose exec -T php bin/console lint:yaml config/
      - name: Check HTTP reachability
        run: curl -v --fail-with-body http://localhost
      - name: Check login page
        run: curl --insecure --fail-with-body https://localhost/login
      - name: Check Mercure reachability
        run: curl -vI --insecure --fail-with-body https://localhost/.well-known/mercure?topic=test
      - name: Create test database
        run: docker compose exec -T php bin/console -e test doctrine:database:create --if-not-exists
      - name: Run test migrations
        run: docker compose exec -T php bin/console -e test doctrine:migrations:migrate --no-interaction
      - name: Run PHPUnit
        run: docker compose exec -T php bin/phpunit
      - name: Validate Doctrine schema
        run: docker compose exec -T php bin/console -e test doctrine:schema:validate
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Lint Code Base
        uses: super-linter/super-linter/slim@v9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Select checks that match the project. PHP runs in its own container.
          VALIDATE_BASH: true
          VALIDATE_BASH_EXEC: true
          VALIDATE_CSS: true
          VALIDATE_DOCKERFILE_HADOLINT: true
          VALIDATE_GITHUB_ACTIONS: true
          VALIDATE_GITHUB_ACTIONS_ZIZMOR: true
          VALIDATE_GITLEAKS: true
          VALIDATE_GIT_MERGE_CONFLICT_MARKERS: true
          VALIDATE_JAVASCRIPT_ES: true
          VALIDATE_JSON: true
          VALIDATE_PYTHON_FLAKE8: true
          VALIDATE_PYTHON_ISORT: true
          VALIDATE_PYTHON_MYPY: true
          VALIDATE_PYTHON_PYLINT: true
          VALIDATE_PYTHON_RUFF: true
          VALIDATE_PYTHON_RUFF_FORMAT: true
          VALIDATE_XML: true
          VALIDATE_YAML: true
  production:
    name: Production image
    needs: [tests, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      COMPOSE_PROJECT_NAME: weekly-news-production-check
      APP_IMAGE: weekly-news:production-check
      SERVER_NAME: localhost
      HTTP_PORT: "18080"
      HTTPS_PORT: "18443"
      HTTP3_PORT: "18443"
      POSTGRES_DB: app_deployment_test
      POSTGRES_PASSWORD: production-ci-password
      APP_SECRET: production-ci-secret-for-isolated-testing-only
      CADDY_MERCURE_JWT_SECRET: production-ci-mercure-secret-for-isolated-testing-only
      DEPLOYMENT_TEST_BASE_URL: https://localhost:18443
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build production image from committed files
        uses: docker/bake-action@v7
        with:
          pull: true
          load: true
          source: .
          files: |
            compose.yaml
            compose.prod.yaml
          set: |
            *.cache-from=type=gha,scope=production
            *.cache-to=type=gha,scope=production,mode=max
            php.labels.org.opencontainers.image.source=https://github.com/${{ github.repository }}
            php.labels.org.opencontainers.image.revision=${{ github.sha }}
      - name: Deploy to isolated stack with memory limits
        run: |
          bin/deploy "$APP_IMAGE" .env.production.example
          test "$(sed -n 's/^APP_IMAGE=//p' .env.production.example)" = "$APP_IMAGE"
          test "$(stat -c '%a' .env.production.example)" = 600
      - name: Prepare isolated fixtures
        run: |
          docker compose -f compose.yaml -f compose.prod.yaml exec -T php php < tests/Deployment/fixtures.php > "$RUNNER_TEMP/production-fixtures.json"
      - name: Exercise production HTTP flows with four participants
        run: python3 tests/Deployment/smoke.py "$RUNNER_TEMP/production-fixtures.json"
      - name: Verify persistence across container recreation
        run: |
          docker compose -f compose.yaml -f compose.prod.yaml up -d --wait --no-build --force-recreate php
          python3 tests/Deployment/smoke.py "$RUNNER_TEMP/production-fixtures.json" --verify
      - name: Test backup and restoration in isolated stack
        run: |
          backup_path=$(bin/backup .env.production.example)
          (cd "$backup_path" && sha256sum --check SHA256SUMS)
          docker compose -f compose.yaml -f compose.prod.yaml stop php
          docker compose -f compose.yaml -f compose.prod.yaml exec -T database sh -c 'exec pg_restore --clean --if-exists --exit-on-error -U "$POSTGRES_USER" -d "$POSTGRES_DB"' < "$backup_path/database.dump"
          docker compose -f compose.yaml -f compose.prod.yaml run --rm -T --no-deps --entrypoint sh php -c 'find /app/var/uploads/prod -type f -delete; tar -xzf - -C /app/var/uploads' < "$backup_path/uploads.tar.gz"
          docker compose -f compose.yaml -f compose.prod.yaml up -d --wait --no-build php
          python3 tests/Deployment/smoke.py "$RUNNER_TEMP/production-fixtures.json" --verify
      - name: Test Railway startup behind HTTPS proxy
        env:
          DEPLOYMENT_TEST_BASE_URL: https://localhost:18444
        run: |
          docker compose -p weekly-news-railway-check -f tests/Deployment/railway.compose.yaml run --rm -T migrations
          docker compose -p weekly-news-railway-check -f tests/Deployment/railway.compose.yaml up -d --wait app proxy
          docker compose -p weekly-news-railway-check -f tests/Deployment/railway.compose.yaml exec -T --user www-data app php < tests/Deployment/fixtures.php > "$RUNNER_TEMP/railway-fixtures.json"
          python3 tests/Deployment/smoke.py "$RUNNER_TEMP/railway-fixtures.json"
          docker compose -p weekly-news-railway-check -f tests/Deployment/railway.compose.yaml up -d --wait --force-recreate app
          python3 tests/Deployment/smoke.py "$RUNNER_TEMP/railway-fixtures.json" --verify
          docker compose -p weekly-news-railway-check -f tests/Deployment/railway.compose.yaml exec -T app sh -c 'test "$(awk "/^Uid:/ {print \$2}" /proc/1/status)" = 33'
      - name: Show production logs on failure
        if: failure()
        run: |
          docker compose -f compose.yaml -f compose.prod.yaml logs --tail 100
          docker compose -p weekly-news-railway-check -f tests/Deployment/railway.compose.yaml logs --tail 100
      - name: Publish tested commit image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag "$APP_IMAGE" "$image"
          docker push "$image"
          printf 'Imagem publicada: %s\n' "$image" >> "$GITHUB_STEP_SUMMARY"
      - name: Stop isolated stack
        if: always()
        run: |
          docker compose -p weekly-news-railway-check -f tests/Deployment/railway.compose.yaml down --remove-orphans --volumes
          docker compose -f compose.yaml -f compose.prod.yaml down --remove-orphans --volumes
