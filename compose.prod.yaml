---
# Production environment override
services:
  php:
    image: ${APP_IMAGE:-app-php-prod}
    build:
      context: .
      target: frankenphp_prod
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      APP_SECRET: ${APP_SECRET:?Defina APP_SECRET no arquivo de producao}
      RUN_MIGRATIONS: "0"
      LOCK_DSN: flock
      SERVER_NAME: ${SERVER_NAME:?Defina SERVER_NAME}, php:80
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-app}?serverVersion=16&charset=utf8
      MERCURE_PUBLISHER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET:?Defina CADDY_MERCURE_JWT_SECRET}
      MERCURE_SUBSCRIBER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET:?Defina CADDY_MERCURE_JWT_SECRET}
      FRANKENPHP_CONFIG: |
        num_threads 1
        max_threads 2
      FRANKENPHP_WORKER_CONFIG: num 1
      GOMEMLIMIT: 96MiB
      CADDY_SERVER_LOG_OPTIONS: level WARN
    mem_limit: 256m
    memswap_limit: 384m
    volumes:
      - news_sessions:/app/var/sessions
  database:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - shared_buffers=16MB
      - -c
      - max_connections=20
      - -c
      - work_mem=1MB
      - -c
      - maintenance_work_mem=16MB
      - -c
      - max_wal_size=256MB
    mem_limit: 128m
    memswap_limit: 192m

volumes:
  news_sessions:
